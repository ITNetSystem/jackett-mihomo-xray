name: Publish experimental Mihomo and Xray image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, start.sh, .dockerignore, .github/workflows/publish.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:1.19.32-xray26.10.10
            ${{ steps.image.outputs.name }}:experimental
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Experimental Mihomo 1.19.32 and Xray 26.10.10; configurations mounted separately

name: Publish Jackett Mihomo Xray
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, minimize-python.py, retire-variants.py, bridge.py, bridge-start.sh, exec-mihomo.py, test_bridge.py, .dockerignore, .github/workflows/publish.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test subscription conversion
        run: python -m pip install PyYAML && python -m unittest -v test_bridge.py
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build ARMv7 for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm/v7
          load: true
          tags: jackett-armv7-check:local
          provenance: false
          sbom: false
      - name: Verify ARMv7 runtimes
        run: |
          docker run --rm --platform linux/arm/v7 --entrypoint /usr/bin/mihomo jackett-armv7-check:local -v
          docker run --rm --platform linux/arm/v7 --entrypoint /usr/local/bin/xray jackett-armv7-check:local version
          docker run --rm --platform linux/arm/v7 --entrypoint python3 jackett-armv7-check:local -c "import ssl, urllib.request, yaml; import sys; sys.path.insert(0, '/usr/local/lib/jackett'); import bridge"
      - name: Publish full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Jackett Mihomo Xray
            org.opencontainers.image.description=Mihomo 1.19.32 and Xray 26.10.10 with ENV subscriptions and Zashboard
      - name: Remove retired light and compact package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python3 retire-variants.py

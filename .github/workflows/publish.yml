name: Publish VPN Jackett Xray
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - bridge.py
      - controller.py
      - network.py
      - test_bridge.py
      - test_controller.py
      - test_network.py
      - check-network.sh
      - bridge-start.sh
      - ui/**
      - .dockerignore
      - .github/workflows/publish.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test Xray controller
        run: python -m unittest -v test_bridge.py test_controller.py test_network.py
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Preserve previous combined release
        run: |
          if ! docker buildx imagetools inspect "${{ steps.image.outputs.name }}:mihomo-1.19.33-xray-26.10.31" >/dev/null 2>&1; then
            docker buildx imagetools create \
              --tag "${{ steps.image.outputs.name }}:mihomo-1.19.33-xray-26.10.31" \
              "${{ steps.image.outputs.name }}:latest"
          fi
      - name: Validate all architectures
        run: |
          for platform in linux/arm/v7 linux/arm64 linux/amd64; do
            docker buildx build --target runtime --platform "$platform" --load -t jackett-xray-check:local .
            docker run --rm --platform "$platform" --entrypoint /usr/local/bin/xray jackett-xray-check:local version | grep -q '^Xray 26\.10\.31 '
            if docker run --rm --platform "$platform" --entrypoint sh jackett-xray-check:local -c 'command -v mihomo'; then
              echo 'Mihomo must not exist in the Xray-only image' >&2
              exit 1
            fi
            docker run --rm --platform "$platform" --entrypoint python3 jackett-xray-check:local -c "import sys; sys.path.insert(0, '/usr/local/lib/jackett'); import bridge, controller, network"
          done
      - name: Smoke-test own GUI and controller
        run: |
          docker run -d --name xray-check -e JACKETT_NETWORK_MODE=proxy \
            -e 'XRAY_JSON1={"remarks":"Direct test","outbounds":[{"tag":"proxy","protocol":"freedom"}]}' \
            jackett-xray-check:local
          for attempt in $(seq 1 60); do
            docker exec xray-check wget -q -O /tmp/status http://127.0.0.1:9090/api/status && break || sleep 1
          done
          docker exec xray-check sh -c 'grep -q "\"core\": \"Xray\"" /tmp/status && wget -q -O /tmp/page http://127.0.0.1:9090/ui/ && grep -q "VPN Jackett" /tmp/page'
          if docker exec xray-check sh -c 'grep -Rqi mihomo /usr/local/share/jackett-ui'; then exit 1; fi
          docker rm -f xray-check
      - name: Validate policy routing natively
        run: docker run --rm --cap-add NET_ADMIN --sysctl net.ipv4.conf.all.rp_filter=0 --sysctl net.ipv4.conf.default.rp_filter=0 --entrypoint sh jackett-xray-check:local /usr/local/bin/jackett-check-network
      - name: Publish Xray-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/arm64,linux/amd64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:xray-26.10.31
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=VPN Jackett Xray
            org.opencontainers.image.description=Xray-only router with VPN Jackett controller and GUI
      - name: Remove obsolete with-ui package version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const versions = await github.paginate(github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg, {
              package_type: 'container', package_name: context.repo.repo, org: context.repo.owner, per_page: 100
            });
            for (const version of versions) {
              const tags = version.metadata?.container?.tags || [];
              if (tags.includes('with-ui') && !tags.includes('latest')) {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container', package_name: context.repo.repo,
                  org: context.repo.owner, package_version_id: version.id
                });
              }
            }
